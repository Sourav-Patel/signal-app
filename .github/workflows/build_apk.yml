name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.22.0
          channel: stable

      - name: Scaffold Flutter project and copy source
        run: |
          flutter create --project-name signal_app --org com.signalengine temp_app
          cp -r lib/* temp_app/lib/
          cp pubspec.yaml temp_app/pubspec.yaml

      - name: Build APK
        working-directory: temp_app
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: signal-engine-apk
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
